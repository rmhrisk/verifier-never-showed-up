/* ============ RENDER THE RECORD ============ */
const rowsEl=document.getElementById("record-rows");
const barEl=document.getElementById("distbar");
const legEl=document.getElementById("distlegend");
const nEl=document.getElementById("dist-n");
const footEl=document.getElementById("record-foot");
let filter="national";

function tagChips(r){
  const out = r.o ? '<span class="chip out-'+r.o+'">'+OUTCOME[r.o].label+'</span>' : '';
  const tags = r.t.map(([k,wt])=>
    '<span class="chip fam-'+TAG[k].f+(wt===1?' contrib':'')+'" title="'+TAG[k].d+'">'+
    TAG[k].label+'</span>').join(" ");
  return [out,tags].filter(Boolean).join(" ");
}
function visible(){
  if(KIND[filter]) return RECORD.filter(r=>r.k===filter);
  if(filter==="all") return RECORD;
  if(filter==="mandated") return RECORD.filter(r=>r.m===1);
  if(filter==="working") return RECORD.filter(r=>r.o==="working");
  if(FAM[filter]) return RECORD.filter(r=>r.t.some(([k])=>TAG[k].f===filter));
  return RECORD.filter(r=>r.t.some(([k])=>k===filter));
}
function render(){
  const rows=visible().slice().sort((a,b)=>a.y-b.y);
  rowsEl.innerHTML=rows.map(r=>
    '<tr><td class="prog">'+r.p+'</td><td>'+r.w+'</td><td class="yr">'+r.y+'</td>'+
    '<td class="tags">'+tagChips(r)+'</td><td class="note">'+r.n+'</td></tr>').join("");
  nEl.textContent=rows.length;
  const kh=document.getElementById("record-scope");
  if(kh) kh.textContent = KIND[filter] ? KIND[filter].plural
        : (filter==="all" ? "programs, all kinds" : "programs under the current filter");

  const famCount={}; Object.keys(FAM).forEach(k=>famCount[k]=0);
  const tagCount={}; Object.keys(TAG).forEach(k=>tagCount[k]=0);
  let incid=0;
  rows.forEach(r=>r.t.forEach(([k])=>{famCount[TAG[k].f]++;tagCount[k]++;incid++}));
  const tot=incid||1;
  barEl.innerHTML=Object.keys(FAM).filter(k=>famCount[k]>0).map(k=>
    '<span style="flex-grow:'+famCount[k]+';background:'+FAM[k].color+'" title="'+
    FAM[k].label+': '+famCount[k]+' tags">'+
    (famCount[k]/tot>0.08?FAM[k].label+' '+famCount[k]:famCount[k])+'</span>').join("")
    || '<span style="flex-grow:1;background:#DEDED7"></span>';
  legEl.innerHTML=Object.keys(TAG).sort((a,b)=>tagCount[b]-tagCount[a]).map(k=>
    '<span'+(tagCount[k]?'':' class="zero"')+'><i class="swatch" style="background:'+
    FAM[TAG[k].f].color+'"></i>'+TAG[k].label+' <b>'+tagCount[k]+'</b></span>').join("");

  if(typeof rexp!=="undefined" && rexp && !rbody.classList.contains("expanded"))
    rexp.textContent="Show all "+rows.length+" rows";
  if(typeof syncFade==="function") requestAnimationFrame(syncFade);
  const decided=rows.filter(r=>r.o!=="pending"&&r.o!=="uncertain").length;
  const worked=rows.filter(r=>r.o==="working").length;
  const failed=rows.filter(r=>r.o==="failed");
  const perFail=failed.length? (failed.reduce((a,r)=>a+r.t.length,0)/failed.length).toFixed(1):"0";
  footEl.innerHTML='Solid chips are primary causes; outlined chips are contributing. '+
    'The bar counts <b>'+incid+'</b> tag incidences rather than programs, and failed programs carry <b>'+
    perFail+'</b> modes each on average, because they do not fail one way at a time. '+
    'Of <b>'+decided+'</b> programs where an outcome could be identified, <b>'+worked+'</b> worked.';
}
/* scroll affordance: fade out at the end, and an escape from the scroll box */
const rbody=document.getElementById("record-body");
const rfade=document.getElementById("record-fade");
const rexp=document.getElementById("record-expand");
const rmore=document.getElementById("record-more-text");
function syncFade(){
  if(!rbody||!rfade) return;
  const more = rbody.scrollHeight - rbody.clientHeight - rbody.scrollTop > 8;
  rfade.classList.toggle("hidden", !more || rbody.classList.contains("expanded"));
}
if(rbody){
  rbody.addEventListener("scroll", syncFade, {passive:true});
  window.addEventListener("resize", syncFade);
}
if(rexp){
  rexp.addEventListener("click", ()=>{
    const open = rbody.classList.toggle("expanded");
    rexp.setAttribute("aria-expanded", String(open));
    const n = document.getElementById("record-rows").children.length;
    rexp.textContent = open ? "Collapse the table" : "Show all "+n+" rows";
    rmore.textContent = open ? "Showing every row." : "Scroll the table, or open it in full.";
    if(!open) rbody.scrollTop = 0;
    syncFade();
  });
}

document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  filter=b.dataset.f;
  [...e.currentTarget.querySelectorAll("button")].forEach(x=>
    x.setAttribute("aria-pressed",String(x===b)));
  render();
});
render();

/* ============ SCORECARD ============ */
/* The questions are static HTML, generated at build time by gen_diagnostic.py.
   This only attaches behavior, so the section exists with JS disabled and the
   markup is the single source of truth. */
const scq=document.getElementById("sc-questions");
const SCQ=[...scq.querySelectorAll(".sc-q")].map(el=>({c:el.dataset.mode}));
const scState=new Array(SCQ.length).fill(null);
scq.addEventListener("click",e=>{
  const b=e.target.closest(".sc-opt"); if(!b) return;
  const i=+b.dataset.q; scState[i]=+b.dataset.v;
  [...scq.querySelectorAll('.sc-opt[data-q="'+i+'"]')].forEach(x=>
    x.setAttribute("aria-pressed",String(x===b)));
  scoreCard();
});
const STRUCTURAL=["noverifier","liability","political","coordination","lockin"];
function scoreCard(){
  const answered=scState.filter(v=>v!==null).length;
  const head=document.querySelector("#sc-result strong");
  const sum=document.getElementById("sc-summary");
  const flags=document.getElementById("sc-flags");
  if(answered<SCQ.length){
    head.textContent="Answered "+answered+" of "+SCQ.length+".";
    sum.textContent=" The result names the failure modes this proposal is exposed to and separates the structural ones from the fixable ones.";
    flags.innerHTML=""; return;
  }
  const risk={}; Object.keys(TAG).forEach(k=>risk[k]=0);
  SCQ.forEach((q,i)=>{risk[q.c]+=scState[i]});
  const exposed=Object.keys(risk).filter(k=>risk[k]>=2).sort((a,b)=>risk[b]-risk[a]);
  const struct=exposed.filter(k=>STRUCTURAL.includes(k));
  head.textContent = exposed.length===0
    ? "No failure mode is strongly indicated."
    : "Exposed to "+exposed.length+" of 11 failure modes.";
  sum.textContent = exposed.length===0
    ? " Re-run it with the people who own the verifier relationships rather than the build, and check the answers survive contact with them."
    : (struct.length
      ? " "+struct.length+" structural: "+struct.map(k=>TAG[k].label).join(", ")+
        ". No delivery plan reaches those. Change the use case, change the rule, or stop."
      : " All of these are execution and funding findings, which are inside your control.");
  flags.innerHTML=exposed.map(k=>
    '<li><span class="fl-tag" style="background:'+FAM[TAG[k].f].color+'"></span><b>'+
    TAG[k].label+'.</b> '+TAG[k].d+' <i>'+TAG[k].fix+'</i></li>').join("");
}

const qb=document.getElementById("quiz-body");
qb.innerHTML=QUIZ.map((q,i)=>{
  const idx=q.o.map((_,j)=>j);
  for(let k=idx.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[idx[k],idx[r]]=[idx[r],idx[k]];}
  return '<div class="q"><span class="qn">'+(i+1)+' / '+QUIZ.length+'</span><p class="qp">'+q.p+
   '</p><div class="q-opts">'+idx.map(j=>
   '<button class="q-opt" data-q="'+i+'" data-j="'+j+'">'+q.o[j]+'</button>').join("")+
   '</div><div class="q-exp" id="qe'+i+'"></div></div>';
}).join("");
qb.addEventListener("click",e=>{
  const b=e.target.closest(".q-opt"); if(!b||b.disabled) return;
  const i=+b.dataset.q,j=+b.dataset.j,q=QUIZ[i];
  [...qb.querySelectorAll('.q-opt[data-q="'+i+'"]')].forEach(x=>{
    x.disabled=true; if(+x.dataset.j===q.a)x.classList.add("correct")});
  if(j!==q.a)b.classList.add("wrong");
  const ex=document.getElementById("qe"+i);
  ex.innerHTML="<b>"+(j===q.a?q.ok:q.no)+"</b> "+q.e;
  ex.classList.add("show");
});

/* ============ SIDE CONTENTS ACTIVE STATE ============ */
(function(){
  const rail=document.getElementById("rail");
  if(!rail) return;
  const links=[...rail.querySelectorAll('a[href^="#s"]')];
  const targets=links.map(a=>document.querySelector(a.getAttribute("href"))).filter(Boolean);
  if(!targets.length) return;
  let current=null;
  function mark(el){
    if(el===current) return;
    current=el;
    links.forEach(a=>a.classList.toggle("active", a.getAttribute("href")==="#"+el.id));
    const on=rail.querySelector("a.active");
    if(on){
      const r=on.getBoundingClientRect(), rr=rail.getBoundingClientRect();
      if(r.top<rr.top+8||r.bottom>rr.bottom-8) on.scrollIntoView({block:"nearest"});
    }
  }
  const io=new IntersectionObserver(entries=>{
    const vis=entries.filter(e=>e.isIntersecting)
      .sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(vis.length) mark(vis[0].target);
  },{rootMargin:"-12% 0px -70% 0px",threshold:0});
  targets.forEach(t=>io.observe(t));
})();
</script>
